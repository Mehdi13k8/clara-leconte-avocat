name: Deploy Clara preprod

# Sidecar `clara-preprod` on the shared Novagentic Web App, hostname
# preprod.claraleconteavocat.com (routed by nginx in Novagentic_group's
# proxy/). Lives HERE rather than in the parent repo for the same reason as
# deploy.yml: a push to this repo must never start palier or novagentic
# pipelines.
#
# Same image family as production, same Dockerfile, no build argument — the
# point of this environment is to run the EXACT artifact that would ship, so
# nothing about the build may differ. Only two things change, and both are
# injected by Azure at run time rather than baked in:
#
#   - NITRO_PORT=3004. The Dockerfile hardcodes 3003 because that is Clara's
#     production slot; sitecontainers share one localhost namespace, so
#     preprod needs its own free port (3000 novagentic, 3001 palier,
#     3002 palier-preprod, 3003 clara).
#   - The `noindex` header, added by nginx on the preprod hostname only.
#     It is NOT in the image: the pages are prerendered at build time, so a
#     runtime env var could not reach the rendered <meta robots>, and a
#     build argument would make the preprod image differ from the production
#     one — defeating the purpose. See proxy/nginx.conf in Novagentic_group.
#
# Azure sitecontainers quirk: `environmentVariables[].value` is NOT a literal.
# It is the *name* of an App Setting whose value is resolved at runtime. A
# literal `"3004"` resolves to empty (no such App Setting) → Nitro falls
# through to PORT/default 3000 → EADDRINUSE → Azure cancels startup for the
# whole shared Web App. App Settings CLARA_PREPROD_* must exist on the Web App
# (set once; see scripts/provision-clara-preprod.sh).
#
# Does NOT tag `:latest`. That tag is production, and deploy.yml owns it.
#
# One-time Azure/DNS wiring: scripts/provision-clara-preprod.sh

on:
  push:
    branches: ["pre-prod"]
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build + push the image to GHCR only, without updating the sitecontainer"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  # Two preprod deploys racing would PUT the sitecontainer out of order and
  # leave it on the older image. Production has the same exposure but a much
  # lower push rate; preprod is where people push twice in a minute.
  group: clara-preprod
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mehdi13k8/clara-leconte-avocat:${{ github.sha }}
            ghcr.io/mehdi13k8/clara-leconte-avocat:preprod

  deploy:
    needs: build
    if: ${{ github.event.inputs.build_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update clara-preprod sitecontainer
        run: |
          SUB_ID=$(az account show --query id -o tsv)
          az rest --method PUT \
            --url "https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/Novagentic_group/providers/Microsoft.Web/sites/Novagentic/sitecontainers/clara-preprod?api-version=2023-12-01" \
            --body '{"properties":{"image":"ghcr.io/mehdi13k8/clara-leconte-avocat:${{ github.sha }}","isMain":false,"targetPort":3004,"inheritAppSettingsAndConnectionStrings":false,"environmentVariables":[{"name":"NITRO_PORT","value":"CLARA_PREPROD_NITRO_PORT"},{"name":"PORT","value":"CLARA_PREPROD_PORT"},{"name":"NITRO_HOST","value":"CLARA_PREPROD_NITRO_HOST"}]}}' \
            --output none
          echo "clara-preprod → ghcr.io/mehdi13k8/clara-leconte-avocat:${{ github.sha }} (:3004)"
